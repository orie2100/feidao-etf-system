name: Daily ETF Market Update
on:
  schedule:
    - cron: "25 10 * * 1-5" # 18:25 Asia/Shanghai, weekdays
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_market.py
      - name: Commit market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "No data changes."; else git commit -m "chore: update ETF market data" && git push; fi
